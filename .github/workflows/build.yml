name: Build IPA

on: [push]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project CameraControlApp.xcodeproj \
            -scheme CameraControlApp \
            -destination 'generic/platform=iOS' \
            -archivePath build/CameraControlApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/CameraControlApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r CameraControlApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraControlApp-IPA
          path: build/CameraControlApp.ipa