name: Build IPA

on: [push]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPA (Unsigned)
        run: |
          xcodebuild archive \
            -project CameraControlApp.xcodeproj \
            -scheme CameraControlApp \
            -archivePath build/CameraControlApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/CameraControlApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r CameraControlApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraControlApp-IPA
          path: build/CameraControlApp.ipa